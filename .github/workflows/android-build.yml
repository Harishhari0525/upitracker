name: Build Signed Release APK

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Read app version from Gradle
        shell: bash
        run: |
          APP_VERSION="$(sed -nE 's/^[[:space:]]*val appVersionName[[:space:]]*=[[:space:]]*"([^"]+)".*$/\1/p' app/build.gradle.kts)"

          if [[ ! "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Could not read a valid appVersionName from app/build.gradle.kts"
            exit 1
          fi

          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Decode and install release keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > "${{ github.workspace }}/release.jks"

      - name: Build signed release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="${{ github.workspace }}/release.jks" \
            -Pandroid.injected.signing.store.password="${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.RELEASE_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.RELEASE_KEY_PASSWORD }}"

      - name: Prepare release APK
        run: |
          mkdir -p releases
          cp app/build/outputs/apk/release/app-release.apk releases/UPIExpenseTracker.apk

      - name: Remove signing material
        if: always()
        run: rm -f "${{ github.workspace }}/release.jks"

      - name: Create GitHub release and upload APK
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Release v${{ env.APP_VERSION }}
          body: |
            Automated continuous delivery release.
            App version: ${{ env.APP_VERSION }}
          files: releases/UPIExpenseTracker.apk
          draft: false
          prerelease: false
